[package]
name = "zercle-rust-template"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "A production-ready Rust web API template using Axum framework with PostgreSQL, JWT authentication, and Clean Architecture"

[[test]]
name = "unit"
path = "tests/unit/mod.rs"

[dependencies]
axum = { version = "0.8", features = ["multipart", "tower-log"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-br", "limit", "timeout", "set-header"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde", "fast-rng"] }
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.5"
jsonwebtoken = "9"
validator = { version = "0.20", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenv = "0.15"
config = "0.15"
futures = "0.3"
async-trait = "0.1"
tokio-util = { version = "0.7", features = ["compat"] }
parking_lot = "0.12"
reqwest = { version = "0.13", features = ["json"] }
rand = "0.8"

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6.4"
mockall = "0.14"
tempfile = "3"
rstest = "0.26"

[features]
default = ["full"]
full = ["sqlx/postgres", "sqlx/runtime-tokio-rustls"]

[lib]
name = "zercle_rust_template"
path = "src/lib.rs"

[[bin]]
name = "zercle-rust-template"
path = "cmd/server/main.rs"

[workspace]

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
debug = false
lto = true
codegen-units = 1
strip = true
