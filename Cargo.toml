[package]
name = "zercle_rust_template"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Opinionated Rust (axum) microservice template"
license = "MIT"
repository = "https://github.com/zercle/zercle-rust-template"

[[bin]]
name = "server"
path = "src/main.rs"

[[bin]]
name = "migrate"
path = "src/bin/migrate.rs"

[lib]
path = "src/lib.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full", "signal"] }
async-trait = "0.1"
futures = "0.3"

# HTTP
axum = { version = "0.8", features = ["macros", "tokio"] }
tower = { version = "0.5", features = ["util", "limit", "timeout"] }
tower-http = { version = "0.6", features = ["cors", "trace", "catch-panic", "limit", "timeout"] }
hyper = { version = "1", features = ["full"] }
http = "1"

# gRPC
tonic = { version = "0.12", features = ["tls"] }
prost = "0.14"

# DB
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "time", "macros", "migrate"] }

# Cache (Valkey = Redis protocol)
redis = { version = "0.27", features = ["tokio-rustls-comp", "connection-manager"] }

# Config + validation
config = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
validator = { version = "0.18", features = ["derive"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt", "registry"] }
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", features = ["trace", "metrics", "http-proto", "reqwest-client"] }
opentelemetry-prometheus = "0.27"
prometheus = "0.13"
tracing-opentelemetry = "0.28"

# Errors + utils
thiserror = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
time = { version = "0.3", features = ["serde", "serde-well-known", "parsing", "formatting", "macros"] }
once_cell = "1"
url = "2"
humantime = "2"

[dev-dependencies]
mockall = "0.13"
pretty_assertions = "1"
tokio = { version = "1", features = ["test-util", "macros", "rt-multi-thread"] }
reqwest = { version = "0.12", features = ["json"] }
tower = { version = "0.5", features = ["util"] }

[build-dependencies]
tonic-build = "0.12"

[lints.clippy]
all = { level = "deny", priority = -1 }
