app:
  host: "0.0.0.0"
  port: 3000
  env: "prod"

database:
  host: "db.zercle.internal"
  port: 5432
  user: "zercle"
  password: "${DB_PASSWORD}"
  name: "zercle"
  sslmode: "require"
  max_open_conns: 50
  max_idle_conns: 10
  conn_max_lifetime: "5m"

jwt:
  secret: "${JWT_SECRET}"
  access_token_expiry: 3600
  refresh_token_expiry: 604800

argon2id:
  memory: 65536
  iterations: 3
  parallelism: 2
  salt_length: 32
  key_length: 64

logging:
  level: "info"
  format: "json"

cors:
  allowed_origins: ["https://zercle.app", "https://admin.zercle.app"]
  allowed_methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
  allowed_headers: ["Origin", "Content-Type", "Accept", "Authorization"]
