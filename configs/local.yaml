app:
  name: "Zercle API"
  host: "0.0.0.0"
  port: 3000
  env: "local"

database:
  host: "localhost"
  port: 5432
  user: "postgres"
  password: "postgres"
  name: "zercle"
  sslmode: "disable"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: "5m"

redis:
  host: "localhost"
  port: 6379
  pool_size: 10

jwt:
  secret: "your-jwt-secret-key"
  access_token_expiry: 3600
  refresh_token_expiry: 604800

argon2id:
  memory: 19456
  iterations: 2
  parallelism: 1
  salt_length: 16
  key_length: 32

logging:
  level: "debug"
  format: "console"

rate_limit:
  requests_per_minute: 60

cors:
  allowed_origins:
    - "http://localhost:3000"
    - "http://localhost:8080"
    - "http://127.0.0.1:3000"
  allowed_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "PATCH"
    - "DELETE"
    - "OPTIONS"
  allowed_headers:
    - "Origin"
    - "Content-Type"
    - "Accept"
    - "Authorization"
