version: '3.8'

services:
  api:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
    container_name: zercle-api
    ports:
      - "3000:3000"
    environment:
      - RUST_LOG=info
      - SERVER_ENV=local
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=zercle
      - DB_SSLMODE=disable
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production}
      - RATE_LIMIT_REQUESTS_PER_MINUTE=60
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - zercle-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:16-alpine
    container_name: zercle-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=zercle
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - zercle-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: zercle-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - zercle-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: Database migration runner
  migrate:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.migrate
    container_name: zercle-migrate
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/zercle?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - zercle-network
    profiles:
      - migrate

volumes:
  postgres-data:
  redis-data:

networks:
  zercle-network:
    driver: bridge
