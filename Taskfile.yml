version: '3'

vars:
  BIN_DIR: target/release
  BIN_SERVER: '{{.BIN_DIR}}/server'
  BIN_MIGRATE: '{{.BIN_DIR}}/migrate'
  COVERAGE_OUT: coverage.lcov
  COVERAGE_THRESHOLD: '60'

tasks:
  build:
    desc: Build the server binary (release). Version/CommitSHA/BuildTime are injected via env so option_env! in src/app.rs picks them up at compile time.
    env:
      VERSION: '{{.GIT_VERSION | default "dev"}}'
      COMMIT_SHA: '{{.GIT_COMMIT | default "unknown"}}'
      BUILD_TIME: '{{.BUILD_TIME | default "unknown"}}'
    cmds:
      - cargo build --release --bin server

  build-all:
    desc: Build both server and migrate binaries (release).
    env:
      VERSION: '{{.GIT_VERSION | default "dev"}}'
      COMMIT_SHA: '{{.GIT_COMMIT | default "unknown"}}'
      BUILD_TIME: '{{.BUILD_TIME | default "unknown"}}'
    cmds:
      - cargo build --release

  run:
    desc: Run the server locally (depends on a release build). Loads .env (Go Taskfile parity) so DB_*/VALKEY_* come from the copied example.
    dotenv: ['.env']
    deps: [build]
    cmds:
      - '{{.BIN_SERVER}}'

  test:
    desc: Run unit tests (default).
    cmds:
      - task: test-unit

  test-unit:
    desc: Run unit tests via cargo (no live infra required).
    cmds:
      - cargo test --all-targets

  test-integration:
    desc: >-
      Run the full live-infra suite (all #[ignore]-gated tests + the e2e server test). Loads .env
      (Go Taskfile parity), so the integration harnesses derive their DSN from the DB_* config
      leaves with no hand-exported environment; DATABASE_URL is an optional override and must
      point at a local throwaway database. Bring infra up first with
      `docker compose up -d postgres valkey` and apply migrations (`task migrate-up`).
    dotenv: ['.env']
    cmds:
      - cargo test --all-targets -- --include-ignored --test-threads=1

  test-architecture:
    desc: Run the clean-architecture dependency gates (tests/architecture.rs; matches the CI Architecture job).
    cmds:
      - cargo test --test architecture

  test-e2e:
    desc: >-
      Run the e2e test that boots the full app and drives one HTTP flow per feature. Loads .env
      (Go Taskfile parity), so it reads the DB_* config leaves with no exports. Requires
      `docker compose up -d postgres valkey` and migrations applied first (`task migrate-up`).
      Self-skips when infra is unreachable.
    dotenv: ['.env']
    cmds:
      - cargo test --test e2e -- --include-ignored

  lint:
    desc: Run clippy with warnings denied (matches CI).
    cmds:
      - cargo clippy --all-targets -- -D warnings

  fmt:
    desc: Format Rust sources with rustfmt.
    cmds:
      - cargo fmt

  fmt-check:
    desc: Verify formatting without modifying files (matches CI fmt job).
    cmds:
      - cargo fmt --all -- --check

  tidy:
    desc: Refresh the dependency graph (no direct equivalent of `go mod tidy`; `cargo fetch` syncrates Cargo.lock with Cargo.toml).
    cmds:
      - cargo fetch
      - git diff --exit-code Cargo.lock

  verify:
    desc: Verify the dependency state has no uncommitted diff.
    cmds:
      - task: tidy
      - git diff --exit-code Cargo.lock Cargo.toml

  migrate-up:
    desc: Run database migrations via the registry-based `migrate` binary (sqlx::migrate!; builds its DSN from the DB_* config leaves loaded from .env).
    dotenv: ['.env']
    cmds:
      - cargo run --bin migrate -- up

  migrate-down:
    desc: "Roll back one database migration. Override N: `task migrate-down N=3`."
    dotenv: ['.env']
    cmds:
      - cargo run --bin migrate -- down {{.N | default "1"}}

  migrate-create:
    desc: >-
      Create a reversible migration pair under
      src/features/<FEATURE>/adapter/driven/postgres/migrations/ using the next free GLOBAL
      version number across all features (versions are one namespace, port-spec §1).
      Usage: `task migrate-create FEATURE=catalog NAME=add_discount`.
    dotenv: ['.env']
    cmds:
      - silent: true
        cmd: |
          set -e
          if [ -z "{{.FEATURE}}" ] || [ -z "{{.NAME}}" ]; then
            echo "usage: task migrate-create FEATURE=<feature> NAME=<migration_name>" >&2
            exit 1
          fi
          dir="src/features/{{.FEATURE}}/adapter/driven/postgres/migrations"
          if [ ! -d "$dir" ]; then
            echo "no migrations directory for feature '{{.FEATURE}}': $dir" >&2
            exit 1
          fi
          last=$(ls src/features/*/adapter/driven/postgres/migrations/*.sql 2>/dev/null \
            | sed -E 's#.*/##; s/^0*([0-9]+)_.*/\1/' \
            | sort -n | tail -1)
          next=$(printf '%06d' "$(( ${last:-0} + 1 ))")
          up="$dir/${next}_{{.NAME}}.up.sql"
          down="$dir/${next}_{{.NAME}}.down.sql"
          if [ -e "$up" ] || [ -e "$down" ]; then
            echo "migration already exists: $up / $down" >&2
            exit 1
          fi
          : > "$up"
          : > "$down"
          echo "created $up"
          echo "created $down"
          echo "edit both files by hand; with sqlx-cli installed, \`sqlx migrate add -r --source $dir {{.NAME}}\` is the per-directory alternative (timestamp version)."

  proto:
    desc: Regenerate protobuf/gRPC code. Handled automatically by build.rs (tonic-build) on every cargo build; this task is a no-op kept for parity with the Go Taskfile.
    cmds:
      - 'echo "proto: handled by build.rs (tonic-build). Run \`cargo build\` to regenerate."'

  docker-build:
    desc: Build the server container image (multi-stage, musl static, distroless/static final).
    cmds:
      - docker build -f Containerfile -t zercle-rust-template:latest .

  docker-build-migrate:
    desc: Build the migrate container image.
    cmds:
      - docker build -f Containerfile.migrate -t zercle-rust-template-migrate:latest .

  cover:
    desc: "Collect coverage with cargo-llvm-cov and emit HTML + lcov. Requires: `cargo install cargo-llvm-cov` and `rustup component add llvm-tools-preview` (or brew llvm + LLVM_COV/LLVM_PROFDATA). Gate defaults to 60%."
    env:
      COVERAGE_THRESHOLD: '{{.COVERAGE_THRESHOLD}}'
    cmds:
      - cargo llvm-cov --workspace --all-targets --lcov --output-path {{.COVERAGE_OUT}}
      - cargo llvm-cov --workspace --all-targets --html
      - cmd: |
          total=$(awk -F':' '/^DA/{split($2,a,","); n++; if(a[2]+0>0) h++} END{printf "%.0f", 100*h/n}' {{.COVERAGE_OUT}})
          echo "Coverage: $total%"
          [ "$total" -ge "$COVERAGE_THRESHOLD" ] || { echo "Coverage below ${COVERAGE_THRESHOLD}% threshold"; exit 1; }
