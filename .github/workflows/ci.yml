# =============================================================================
# Zercle Rust Template - CI/CD Pipeline
# =============================================================================
# Comprehensive GitHub Actions workflow for automated testing, code quality,
# and build verification for a Rust-based Clean Architecture project.
#
# Triggers:
#   - Push to main/master branches
#   - Pull requests targeting main/master
#
# Jobs:
#   - lint: Code formatting and linting checks
#   - test: Unit and integration tests
#   - build: Release build verification
#
# =============================================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE*'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE*'

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Database configuration
  POSTGRES_USER: test_user
  POSTGRES_PASSWORD: test_password
  POSTGRES_DB: test_db
  DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_db

  # Cargo configuration
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: false

jobs:
  # ===========================================================================
  # Lint Job - Code Formatting and Linting
  # ===========================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-

      - name: Check code formatting
        run: cargo fmt -- --check

      - name: Run Clippy linter
        run: cargo clippy --all-targets --all-features -- -D warnings

  # ===========================================================================
  # Test Job - Unit and Integration Tests
  # ===========================================================================
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 10s

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Install PostgreSQL client tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client libpq-dev

      - name: Wait for PostgreSQL to be ready
        run: |
          echo "Waiting for PostgreSQL to be ready..."
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U test_user -d test_db; then
              echo "PostgreSQL is ready!"
              exit 0
            fi
            echo "Waiting for PostgreSQL... (attempt $i/30)"
            sleep 2
          done
          echo "PostgreSQL did not become ready in time"
          exit 1

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres

      - name: Run database migrations
        run: |
          echo "y" | cargo sqlx database drop --database-url $DATABASE_URL || true
          cargo sqlx database create --database-url $DATABASE_URL
          cargo sqlx migrate run --database-url $DATABASE_URL --source sqlc/migrations
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Run unit tests (lib)
        run: cargo test --lib -- --test-threads=4
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Run integration tests
        run: |
          cargo test --test api_test -- --test-threads=4
          cargo test --test entity_validation_test -- --test-threads=4
          cargo test --test repository_test -- --test-threads=4
          cargo test --test settings_test -- --test-threads=4
          cargo test --test handler_test -- --test-threads=4
          cargo test --test middleware_test -- --test-threads=4
          cargo test --test usecase_test -- --test-threads=4
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/test-results/
          retention-days: 7

  # ===========================================================================
  # Build Verification Job
  # ===========================================================================
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Build in debug mode
        run: cargo build

      - name: Build in release mode
        run: cargo build --release

      - name: Verify release binary exists
        run: |
          if [ -f target/release/zercle-rust-template ]; then
            echo "Release binary found!"
            ls -lh target/release/zercle-rust-template
          else
            echo "ERROR: Release binary not found!"
            ls -lh target/release/ 2>/dev/null || echo "No release directory found"
            exit 1
          fi

      - name: Verify binary is executable
        run: file target/release/zercle-rust-template

      - name: Upload release binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-binary
          path: target/release/zercle-rust-template
          retention-days: 7

  # ===========================================================================
  # All Tests Summary Job
  # ===========================================================================
  summary:
    name: Summary
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Create summary comment
        run: |
          # Determine status for each job
          LINT_STATUS="${{ needs.lint.result }}"
          TEST_STATUS="${{ needs.test.result }}"
          BUILD_STATUS="${{ needs.build.result }}"
          
          echo "## CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Lint results
          echo "### Lint" >> $GITHUB_STEP_SUMMARY
          if [ "$LINT_STATUS" = "success" ]; then
            echo ":white_check_mark: Code formatting and linting passed" >> $GITHUB_STEP_SUMMARY
          else
            echo ":x: Code formatting or linting failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Test results
          echo "### Test" >> $GITHUB_STEP_SUMMARY
          if [ "$TEST_STATUS" = "success" ]; then
            echo ":white_check_mark: Tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo ":x: Tests failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Build results
          echo "### Build" >> $GITHUB_STEP_SUMMARY
          if [ "$BUILD_STATUS" = "success" ]; then
            echo ":white_check_mark: Release build successful" >> $GITHUB_STEP_SUMMARY
          else
            echo ":x: Release build failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Overall status
          echo "---" >> $GITHUB_STEP_SUMMARY
          if [ "$LINT_STATUS" = "success" ] && [ "$TEST_STATUS" = "success" ] && [ "$BUILD_STATUS" = "success" ]; then
            echo ":tada: All checks passed!" >> $GITHUB_STEP_SUMMARY
          else
            echo ":warning: Some checks failed. Please review the logs." >> $GITHUB_STEP_SUMMARY
          fi
