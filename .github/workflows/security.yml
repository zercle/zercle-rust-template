# =============================================================================
# GitHub Actions Security Workflow
# =============================================================================
# This workflow runs weekly security scans to detect vulnerabilities.
#
# Triggers:
#   - Weekly schedule (Monday 06:00 UTC)
#   - Manual dispatch
#
# Jobs:
#   - trivy-scan: Full filesystem scan with Trivy
#   - cargo-audit: Rust dependency vulnerability check (RustSec advisory db)
# =============================================================================

name: Weekly Security Scan

on:
  schedule:
    - cron: '0 6 * * 1'  # Monday 06:00 UTC
  workflow_dispatch:

jobs:
  # ==========================================================================
  # Job: Trivy Scan
  # ==========================================================================
  trivy-scan:
    name: Trivy Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@1f0aa582c8c8f5f7639610d6d38baddfea4fdcee # v0.9.2
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'LOW,MEDIUM,HIGH,CRITICAL'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@6f530319d8c989665d0835536ec9571735fd2008 # v4
        with:
          sarif_file: 'trivy-results.sarif'

  # ==========================================================================
  # Job: Cargo Audit
  # ==========================================================================
  # Rust's counterpart to the Go template's govulncheck: cargo-audit checks
  # Cargo.lock against the RustSec advisory database.
  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install cargo-audit
        uses: taiki-e/install-action@6a241a1328ca6173d49760e1de6702cd5e52ef94 # cargo-audit
        with:
          tool: cargo-audit

      - name: Run cargo audit
        run: cargo audit